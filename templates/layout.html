<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Dino Birthday{% endblock %}</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  <!-- Cute favicon (optional) -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/616/616408.png">
</head>
<body class="bg-pink-100 min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden">

  <!-- Floating dino background -->
  <div id="dino-bg"></div>

  <!-- Page content -->
  <div class="z-10 w-full max-w-4xl mx-auto text-center px-4">
    {% block content %}{% endblock %}
  </div>

  <!-- JS -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <!-- Background Music -->
<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2023/03/12/audio_5c2784b6e2.mp3?filename=soft-lofi-ambient.mp3" type="audio/mpeg">
</audio>

<button id="musicToggle" class="fixed bottom-6 right-6 bg-pink-400 text-white px-4 py-2 rounded-full shadow-lg hover:bg-pink-500 z-50">
  🎵 Music On/Off
</button>

</body>
</html>
